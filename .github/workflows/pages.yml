name: Webseite veröffentlichen
on:
  push:
    branches: ["claude/awesome-bohr-8mqu2d"]
  workflow_run:
    workflows: ["Hobbyraum-Monitor"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/awesome-bohr-8mqu2d
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Eigener Job: im selben Job findet deploy-pages das Artefakt oft noch nicht
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      # GitHub Pages antwortet gelegentlich mit Serverfehlern (500/502) – dann automatisch erneut versuchen
      - id: try1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.try1.outcome == 'failure'
        run: sleep 60
      - id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 180
      - id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
