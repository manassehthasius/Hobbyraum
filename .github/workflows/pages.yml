name: Webseite veröffentlichen
on:
  push:
    branches: ["claude/awesome-bohr-8mqu2d"]
  workflow_run:
    workflows: ["Hobbyraum-Monitor"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/awesome-bohr-8mqu2d
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Eigener Job: im selben Job findet deploy-pages das Artefakt oft noch nicht
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
