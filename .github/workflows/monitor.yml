name: Hobbyraum-Monitor
# Prüft alle 30 Minuten Flatfox + Verwaltungs-Websites auf neue Hobbyräume
# und aktualisiert data/*.json, die von der Webseite (GitHub Pages) gelesen werden.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hobbyraum-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Neue Angebote suchen
        env:
          # optional, nur falls Benachrichtigungen gewünscht (Repo-Secrets):
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scraper/monitor.py --intervall "alle 30 Minuten"
          python3 scripts/build.py
      - name: Stand speichern
        run: |
          git config user.name "hobbyraum-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ANGEBOTE.md VERWALTUNGEN.md emails
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -q -m "Monitor: Stand $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
